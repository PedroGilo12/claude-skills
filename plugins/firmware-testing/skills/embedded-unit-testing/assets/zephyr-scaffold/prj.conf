# Minimal config for a unit test suite on native_sim.
CONFIG_ZTEST=y

# Assertions always on in the test build.
CONFIG_ASSERT=y

# Do NOT set the coverage config here. In recent Zephyr:
#   - `CONFIG_ZTEST_NEW_API` was REMOVED (ZTEST_SUITE/ZTEST is already the default API) — do not use it.
#   - `CONFIG_COVERAGE_GCOV=y` CONFLICTS with native_sim's COVERAGE_NATIVE_GCOV.
# Let `west twister --coverage` inject the right coverage config on its own.

# Enable here only the subsystems the .c under test really needs
# (e.g. CONFIG_LOG=y). Keep it minimal: a unit test must not bring up the real HAL.
