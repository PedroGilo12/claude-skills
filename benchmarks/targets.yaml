# Alvos de benchmark da embedded-unit-testing: módulos reais com suíte unitária humana.
# A suíte humana é a REFERÊNCIA: a suíte gerada pela skill deve ficar >= nela em cobertura
# (linha/branch/função) e mutation score, medidos só em `sources`.
# O código não é versionado aqui: `python3 tools/fetch_targets.py` baixa em benchmarks/.targets/.
# Medição: `python3 tools/measure.py <alvo> ...` (veja tools/README.md).
#
# set: dev        -> evals/evals.json, guia a iteração da skill
#      validation -> evals/validation-evals.json, só confirma versões (detecta overfitting)
# kind: zephyr    -> suíte é projeto twister; receitas de cobertura/mutação no measure.py
#       host      -> suíte tem build próprio; o measure.py injeta o compilador por um shim
# hidden: removido do workspace entregue à skill (a suíte humana e afins)

targets:
  net_buf:
    set: dev
    path: A
    kind: zephyr
    checkout: zephyr
    sources:
      - lib/net_buf/buf_simple.c
      - lib/net_buf/buf.c
    hidden:
      - tests/lib/net_buf
    # Wrappers de log do módulo (expandem para LOG_*): mesma regra de exclusão de branch de log.
    branch_exclude_extra: '^\s*NET_BUF_(?:SIMPLE_)?(?:DBG|INFO|WARN|ERR)\('
    baseline_suite:
      - tests/lib/net_buf/buf_simple    # type: unit (plataforma unit_testing)
      - tests/lib/net_buf/buf           # native_sim
    baseline_coverage:           # 2026-10-19 (linha / branch / função)
      lib/net_buf/buf.c:        {line: 219/255, branch: 70/88, function: 26/30}
      lib/net_buf/buf_simple.c: {line: 208/232, branch: 0/0, function: 59/65}  # todo branch está em __ASSERT
    baseline_mutation:           # mull 0.34.1, cxx_all (benchmarks/results/net_buf-ref.json)
      lib/net_buf/buf.c:        {killed: 66, survived: 24, equivalent: 5, score: 73.3}
      lib/net_buf/buf_simple.c: {killed: 43, survived: 11, equivalent: 0, score: 79.6}

  esp_partition:
    set: dev
    path: B
    kind: host
    checkout: esp-idf
    sources:
      - components/esp_partition/partition.c
    dependencies:                # o que a suíte precisa isolar
      - components/esp_partition/partition_linux.c   # flash emulada (HW)
    hidden:
      - components/esp_partition/host_test
      - components/esp_partition/test
    baseline_suite:
      - components/esp_partition/host_test/partition_api_test
    # Comando da suíte de referência (cwd = raiz do checkout). {suite} = diretório da suíte.
    baseline_cmd: >-
      . ./export.sh >/dev/null && cd {suite} &&
      idf.py -B build-measure --preview set-target linux &&
      idf.py -B build-measure build && ./build-measure/partition_api_test.elf
    baseline_coverage:
      components/esp_partition/partition.c: {line: 196/218, branch: 84/120, function: 14/14}
    baseline_mutation:
      components/esp_partition/partition.c: {killed: 77, survived: 70, equivalent: 0, score: 52.4}

  onoff:
    set: validation
    path: A
    kind: zephyr
    checkout: zephyr
    sources:
      - lib/utils/onoff.c
    hidden:
      - tests/lib/onoff
    baseline_suite:
      - tests/lib/onoff
    baseline_coverage:           # 2026-10-19 (linha / branch / função)
      lib/utils/onoff.c: {line: 264/267, branch: 154/166, function: 18/18}
    baseline_mutation:           # mull 0.34.1, cxx_all (benchmarks/results/onoff-ref.json)
      lib/utils/onoff.c: {killed: 185, survived: 15, equivalent: 2, score: 92.5}

  log:
    set: validation
    path: B
    kind: host
    checkout: esp-idf
    sources:
      - components/log/src/buffer/log_buffers.c
      - components/log/src/log_level/tag_log_level/tag_log_level.c
      - components/log/src/log_level/tag_log_level/linked_list/log_linked_list.c
      - components/log/src/log_level/tag_log_level/cache/log_binary_heap.c
      - components/log/src/util.c
    hidden:
      - components/log/host_test
      - components/log/test_apps
    baseline_suite:
      - components/log/host_test/log_test   # Catch2/C++, sdkconfig.defaults (não as variantes de CI)
    baseline_cmd: >-
      . ./export.sh >/dev/null && cd {suite} &&
      idf.py -B build-measure --preview set-target linux &&
      idf.py -B build-measure build && ./build-measure/test_log_host.elf --rng-seed 1
    baseline_runner_args: [--rng-seed, '1']   # Catch2 v3 sorteia a ordem; o mull roda o binário com isto
    # Testes de overflow do contador de idade do cache levam 11-22 s; o padrão do mull (3 s)
    # derruba o warmup. Referência medida de novo com este valor: status idêntico.
    mull_timeout_ms: 60000
    baseline_coverage:           # 2026-10-19 (linha / branch / função)
      components/log/src/buffer/log_buffers.c:                                  {line: 58/61, branch: 17/24, function: 7/7}
      components/log/src/log_level/tag_log_level/tag_log_level.c:               {line: 27/30, branch: 10/16, function: 4/5}
      components/log/src/log_level/tag_log_level/linked_list/log_linked_list.c: {line: 27/30, branch: 9/14, function: 5/5}
      components/log/src/log_level/tag_log_level/cache/log_binary_heap.c:       {line: 28/53, branch: 10/24, function: 4/7}
      components/log/src/util.c:                                                {line: 23/23, branch: 6/6, function: 3/3}
    baseline_mutation:           # mull 0.34.1, cxx_all (benchmarks/results/log-ref.json)
      components/log/src/buffer/log_buffers.c:                                  {killed: 14, survived: 32, equivalent: 1, score: 30.4}
      components/log/src/log_level/tag_log_level/tag_log_level.c:               {killed: 17, survived: 8, equivalent: 0, score: 68.0}
      components/log/src/log_level/tag_log_level/linked_list/log_linked_list.c: {killed: 3, survived: 14, equivalent: 0, score: 17.6}
      components/log/src/log_level/tag_log_level/cache/log_binary_heap.c:       {killed: 12, survived: 38, equivalent: 0, score: 24.0}
      components/log/src/util.c:                                                {killed: 18, survived: 0, equivalent: 2, score: 100.0}

# Regras por checkout. branch_exclude: branches em linhas de log/assert não contam
# (no Zephyr é o padrão do twister).
checkouts:
  zephyr:
    repo: https://github.com/zephyrproject-rtos/zephyr
    ref: v4.2.1
    sha: 64e98eb5278d790f3b3e5279ca8b39b45097bbc0
    reference: ~/zephyrproject/zephyr          # clone local reaproveitado, se existir
    venv: ~/zephyrproject/.venv                # vira .venv no workspace
    branch_exclude: '(^\s*LOG_(?:HEXDUMP_)?(?:DBG|INF|WRN|ERR)\(.*)|(^\s*__ASSERT(?:_EVAL|_NO_MSG|_POST_ACTION)?\(.*)'
  esp-idf:
    repo: https://github.com/espressif/esp-idf.git
    ref: v5.4.2
    sha: f5c3654a1c2d2a01f7f67def7a0dc48e691f63c0
    reference: ~/esp/v5.4.2/esp-idf
    submodules: all              # o build do ESP-IDF avalia todos os componentes (ex.: mqtt exige esp-mqtt)
    branch_exclude: '(^\s*ESP_LOG[EWIDV]\(.*)|(^\s*assert\(.*)'

# Ferramenta de mutação, fixada. Extraída sem root em tools/mutation/.mull/ (ignorado pelo git).
mull:
  version: 0.34.1
  url: https://github.com/mull-project/mull/releases/download/0.34.1/Mull-18-0.34.1-LLVM-18.1.3-ubuntu-amd64-24.04.deb
  sha256: 983ea9c84ecab621414d5442a66c1a1ce4127491b79d42fd5e2fd6fe01d02699
  cc: /usr/bin/clang-18          # mesmo LLVM do plugin (18.1.3)
  cxx: /usr/bin/clang++-18
  mutators: [cxx_all]
  workers: 1                     # com 8, timeouts sob carga tornam o resultado instável

# Critério de aceite da suíte da skill, por arquivo (além de >= referência).
acceptance:
  coverage_min: {line: 95, branch: 90, function: 95}
  coverage_target: {line: 100, branch: 100, function: 100}
  mutation_min: 80
