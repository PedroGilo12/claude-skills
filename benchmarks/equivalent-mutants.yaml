# Mutantes comprovadamente equivalentes: nenhum input observável distingue o mutante do original.
# Saem da conta do mutation score em QUALQUER suíte do mesmo alvo (referência e skill).
# id = sha1("arquivo:linha:coluna:operador")[:10], como em benchmarks/results/*.json.
# IDs só com dígitos vão entre aspas (senão o YAML os lê como número).
# Só entra aqui com justificativa verificável no código. Na dúvida, NÃO é equivalente.

net_buf:
  55b95dd108: >-
    buf.c:257 `uninit_count < buf_count` -> `<=`. Com uninit_count == buf_count nenhum buffer
    saiu do pool, então a LIFO `free` está vazia (só recebe buffers devolvidos); o
    k_lifo_get(K_NO_WAIT) extra retorna NULL e o fluxo segue pelo mesmo caminho uninit.
  37f9fa76b5: >-
    buf.c:621 (net_buf_linearize) `offset >= frag->len` -> `>`. Com offset == frag->len o
    mutante fica no fragmento, copia MIN(len, 0) = 0 bytes, avança e zera offset: mesmo
    dst e mesmo retorno.
  e2bab0e2ee: >-
    buf.c:628 (net_buf_linearize) `len > 0` -> `len >= 0`. len é size_t; as iterações extras
    copiam MIN(0, ...) = 0 bytes até frag == NULL; `copied` não muda.
  624c45ff02: >-
    buf.c:708 (net_buf_data_match) `offset >= buf->len` -> `>`. Com offset == buf->len compara
    MIN(len, 0) = 0 bytes, avança e zera offset: mesmo `compared`.
  3b03279fd5: >-
    buf.c:713 (net_buf_data_match) `len > 0` -> `len >= 0`. len é size_t; iterações extras
    comparam 0 bytes até buf == NULL; `compared` não muda.

esp_partition: {}

onoff:
  '8549411368': >-
    onoff.c:304 (process_event) `int res = 0` -> 42. O valor inicial nunca é lido: dentro do
    laço, `res = 0` (L336) vem antes de todo uso (L338-390), e não há uso de res fora do laço.
  c200013a2c: >-
    onoff.c:626 (onoff_sync_finalize) `srv->count < 0` -> `<= 0`. Com count == 0 o mutante
    executa `srv->count = 0`, que não muda nada.

log:
  017bb2c536: >-
    util.c:24 (esp_log_util_cvt) `pad > 0` -> `pad >= 0`. O do-while garante length >= 1; com
    pad == 0 a segunda condição `pad > length` já é falsa, então o laço não roda nos dois casos.
  afa8fbc218: >-
    util.c:38 (esp_log_util_cvt) `orig_buf < buf` -> `<=`. Na igualdade (caractere do meio de
    tamanho ímpar) o mutante troca o caractere com ele mesmo; o buffer final é idêntico.
  8ea7fb72d7: >-
    log_buffers.c:76 `buff_len > BYTES_PER_LINE ? BYTES_PER_LINE : buff_len` -> `>=`. Com
    buff_len == BYTES_PER_LINE os dois ramos dão o mesmo valor.
  # Observação para a futura skill de mutação: os dois abaixo são equivalentes porque o código
  # mutado não tem efeito nenhum. s_log_cache_misses é `static`, só é escrito (L107, L136) e
  # nunca é lido nem exposto, nem por getter nem por log. Um mutante equivalente desse tipo
  # não indica uma lacuna nos testes, e sim código morto ou instrumentação que perdeu o
  # consumidor. Se o código não muda nada, por que ele existe? A skill de mutação deve
  # separar esse caso ("equivalente por código sem efeito": reportar como achado sobre o
  # código, candidato a remoção ou a ser exposto) do equivalente comum, em que o código tem
  # efeito mas o mutante dá o mesmo resultado (ex.: o L184 abaixo e os de util.c acima).
  # Outra observação para a skill de mutação (não é equivalente, não entra na lista):
  # log_binary_heap.c:134 `s_log_cache_max_generation = 0` -> constante, no esp_log_cache_clean.
  # O valor inicial só antecipa o overflow. A única forma de observá-lo pela API é a força
  # bruta (~2^29 chamadas). Um teste com state seam sobrescreve essa variável logo depois do
  # clean e apaga o efeito do mutante. Ele sobrevive por decisão de projeto (seam só ajusta,
  # nunca lê estado interno), e não por lacuna na partição.
  d854e7fdf9: >-
    log_binary_heap.c:107 (esp_log_cache_get_level) `++s_log_cache_misses` -> `--`.
    s_log_cache_misses é static e nunca é lido (só aparece em L72, L107, L136); unsigned, o
    decremento não tem UB. Nenhuma saída muda.
  27e4a8a135: >-
    log_binary_heap.c:136 (esp_log_cache_clean) `s_log_cache_misses = 0` -> constante. Mesmo
    contador nunca lido; o valor atribuído não é observável.
  41fcb22597: >-
    log_binary_heap.c:184 (heap_bubble_down) `left.generation < right.generation` -> `<=`. Só
    difere com gerações iguais, que não ocorrem: bubble_down só roda com o cache cheio
    (count == TAG_CACHE_SIZE), quando todos os slots foram escritos depois do último clean com
    gerações tiradas de s_log_cache_max_generation++ (únicas, < MAX_GENERATION); o
    fix_cache_generation_overflow renumera com 0..count-1 e retoma em count, também únicas.

# Revisão dos 33 sobreviventes da referência (2026-10-20). Os 29 restantes têm efeito
# observável (caminhos de ISR, restauração de prioridade, -ENOMEM, retorno das funções de
# máscara, buffers do msg subscriber, limites de varredura) ou só aparecem no log, como o
# LOG_WRN de IDs duplicados (zbus.c:81-89) e o índice do LOG_DBG (zbus.c:184), que o mull
# não vê. Fora por dúvida: zbus.c:325/342 (`boosting` false/true -> 42). O resultado depende
# de como o 42 vira bool no IR (trunc para i1 dá false).
zbus:
  eed34e5bcb: >-
    zbus.c:159 (_zbus_vded_exec) `int err = 0` -> 42. Store morto: err só é lido depois das
    atribuições nas linhas 199 e 227. [código sem efeito]
  b0c8eae0e2: >-
    zbus.c:264 (chan_update_hop) `chan_highest_observer_priority > obs->data->priority` ->
    `>=`. Na igualdade o mutante atribui o mesmo valor; o mínimo calculado não muda.
  0bfbae873e: >-
    zbus.c:396 (zbus_chan_pub) `context_priority = ZBUS_MIN_THREAD_PRIORITY` -> 42. Com
    PRIORITY_BOOST fora de ISR, chan_lock sobrescreve antes de ler. Nos outros casos, só
    chan_unlock lê (`prio < ZBUS_MIN_THREAD_PRIORITY`), e isso é falso para 14 e para 42.
    Vale com CONFIG_NUM_PREEMPT_PRIORITIES <= 43 (padrão 15). [código sem efeito]
  d5e06e22be: >-
    zbus.c:454 (zbus_chan_notify) `context_priority = ZBUS_MIN_THREAD_PRIORITY` -> 42. Mesmo
    argumento da linha 396. [código sem efeito]
